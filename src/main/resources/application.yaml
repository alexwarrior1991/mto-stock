spring:
  application:
    name: mto-stock
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}
  # La API es un resource server: no emite tokens ni guarda usuarios, solo valida los que emite
  # Keycloak. El JWK Set se descarga de forma perezosa, con lo que un Keycloak que aun no responde
  # no impide arrancar.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}

  # Este servicio solo CONSUME: no publica nada, asi que no hay publisher confirms ni returns que
  # configurar. Lo que hay debajo de listener.simple lo aplica Spring Boot a traves del
  # SimpleRabbitListenerContainerFactoryConfigurer; sin pasar por el, una factory declarada a mano
  # descarta todo este bloque en silencio (ver RabbitMqConfiguration).
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        # El contenedor confirma el mensaje al volver el listener sin excepcion, y lo rechaza si
        # lanza. No hay ack manual porque no hay nada que confirmar a medias: el listener delega en
        # un unico manejador y no reparte el trabajo entre hilos.
        acknowledge-mode: auto
        concurrency: ${SPRING_RABBITMQ_LISTENER_CONCURRENCY:1}
        max-concurrency: ${SPRING_RABBITMQ_LISTENER_MAX_CONCURRENCY:5}
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:10}
        retry:
          # Reintentos acotados: agotados los intentos, el mensaje va a la DLQ. La otra mitad de
          # esa garantia -no reencolar lo rechazado- la fija el codigo y no este bloque, porque un
          # reencolado infinito atasca el canal entero. Ver RabbitMqConfiguration.
          enabled: true
          max-retries: ${SPRING_RABBITMQ_LISTENER_MAX_RETRIES:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  health:
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Make-to-order inventory and stock management API
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}

app:
  security:
    # Cliente de Keycloak que representa a esta API. Sus roles de cliente son los permisos que
    # comprueban la cadena de filtros y las anotaciones de seguridad de metodo.
    client-id: ${KEYCLOAK_CLIENT_ID:mto-stock-api}
    # Claim que se usa como nombre del principal, y por tanto como autor en las columnas de auditoria.
    principal-claim: preferred_username
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:true}
    # Si la validacion de audiencia esta activa y este valor llega vacio, la aplicacion no arranca:
    # sin audiencia la API aceptaria cualquier token emitido por el realm, incluido el del frontal
    # de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-stock-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un entorno
    # desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los perfiles de
    # desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    cors:
      allowed-origins:
        - ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-Id
      exposed-headers:
        - Location
        - X-Correlation-Id
      allow-credentials: false
      max-age: ${APP_CORS_MAX_AGE:3600}

  # Canal de eventos de datos maestros publicados por mto-configuration.
  #
  # El exchange y la routing key son contrato del emisor y no se cambian por gusto: un binding
  # contra un exchange que nadie usa se declara igual de bien y deja de llegar todo sin ningun
  # error visible. La cola y su DLQ si son de este servicio, que es quien las consume.
  #
  # Hoy el consumidor solo registra lo que recibe; la logica de negocio esta pendiente y su punto
  # de entrada es MasterDataEventHandler.
  rabbitmq:
    # Apaga la declaracion de la topologia Y el consumidor. Con esto en false nadie abre una
    # conexion, asi que la aplicacion arranca sin broker.
    enabled: ${APP_RABBITMQ_ENABLED:true}
    master-data:
      exchange: ${APP_RABBITMQ_MASTER_DATA_EXCHANGE:mto.master-data.exchange}
      queue: ${APP_RABBITMQ_MASTER_DATA_QUEUE:mto.stock.master-data.queue}
      routing-key: "${APP_RABBITMQ_MASTER_DATA_ROUTING_KEY:mto.master-data.#}"
      dead-letter-exchange: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_EXCHANGE:mto.stock.master-data.queue.dlx}
      dead-letter-queue: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_QUEUE:mto.stock.master-data.queue.dlq}
      dead-letter-routing-key: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_ROUTING_KEY:mto.stock.master-data.queue.dlq}
      # Permite declarar la topologia sin consumir: util para dejar la cola creada acumulando
      # eventos mientras el servicio todavia no sabe que hacer con ellos.
      listener-enabled: ${APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED:true}
