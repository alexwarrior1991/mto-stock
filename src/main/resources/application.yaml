spring:
  application:
    name: mto-stock
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}
  # La API es un resource server: no emite tokens ni guarda usuarios, solo valida los que emite
  # Keycloak. El JWK Set se descarga de forma perezosa, con lo que un Keycloak que aun no responde
  # no impide arrancar.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://auth.mto.local:8082/realms/mto}

  # Historial de cambios (Hibernate Envers). Vive aqui y no en los application-*.yml porque no
  # cambia por perfil; las propiedades de hibernate se acumulan entre ficheros, asi que esto convive
  # con el format_sql que anade el perfil dev.
  jpa:
    properties:
      org.hibernate.envers:
        # En minusculas a proposito. El sufijo por defecto es _AUD y el nombre final depende de como
        # trate la estrategia de nombres a los identificadores de Envers; fijarlo aqui hace que la
        # tabla se llame igual pase lo que pase. Equivocarse en esto no da un aviso: con
        # ddl-auto: validate la aplicacion no arranca.
        audit_table_suffix: _aud
        revision_field_name: rev
        revision_type_field_name: revtype
        # Guarda el ultimo estado conocido en la fila de borrado. Sin esto un DEL deja solo el id y
        # nulos, y la pregunta que motiva todo esto -que decia la linea de despiece que alguien
        # quito- habria que contestarla yendo a buscar la revision anterior.
        store_data_at_delete: true

  # Conexion con Redis, que respalda la cache de datos maestros. Estos valores solo se usan si
  # app.cache.enabled esta activo: con la cache apagada el CacheManager es un NoOp que no guarda
  # nada y nadie abre una conexion, asi que la aplicacion arranca sin Redis.
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      # Cortos a proposito. El CacheErrorHandler hace que un Redis que no responde no rompa la
      # peticion, pero no que no la retrase: el timeout es lo que acota ese retraso, y una cache
      # que tarda mas que la consulta que evita no sirve para nada.
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}
      # Este servicio no guarda entidades en Redis, solo respuestas ya serializadas: el escaneo de
      # repositorios @RedisHash no tiene nada que encontrar y solo alarga el arranque.
      repositories:
        enabled: false

  # Lo que hay debajo de listener.simple lo aplica Spring Boot a traves del
  # SimpleRabbitListenerContainerFactoryConfigurer; sin pasar por el, una factory declarada a mano
  # descarta todo este bloque en silencio (ver RabbitMqConfiguration).
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    # Publicacion desde el outbox (docs/06-messaging.md): un mensaje solo pasa a PUBLISHED cuando el
    # broker lo confirma, y uno que no encaja en ninguna cola vuelve al publicador en vez de perderse.
    # Sin confirms el relay no arranca (OutboxRabbitPublisher): degradar en silencio seria volver a
    # marcar como publicado lo que el broker no ha aceptado.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # Continua en la publicacion la traza guardada en la fila del outbox, como el listener continua
      # la que llega en las cabeceras.
      observation-enabled: ${SPRING_RABBITMQ_TEMPLATE_OBSERVATION_ENABLED:true}
    listener:
      simple:
        # El contenedor confirma el mensaje al volver el listener sin excepcion, y lo rechaza si
        # lanza. No hay ack manual porque no hay nada que confirmar a medias: el listener delega en
        # un unico manejador y no reparte el trabajo entre hilos.
        acknowledge-mode: auto
        # Continua la traza que viaja en las cabeceras del mensaje. mto-configuration escribe
        # traceparent/tracestate al publicar desde el outbox; sin esto, consumir abria una traza
        # nueva y el salto por la cola quedaba como un corte en el medio. Funciona porque la
        # factory pasa por el configurer: declarada a mano y sin el, esta linea se descartaria en
        # silencio como el resto del bloque.
        observation-enabled: ${SPRING_RABBITMQ_LISTENER_OBSERVATION_ENABLED:true}
        concurrency: ${SPRING_RABBITMQ_LISTENER_CONCURRENCY:1}
        max-concurrency: ${SPRING_RABBITMQ_LISTENER_MAX_CONCURRENCY:5}
        prefetch: ${SPRING_RABBITMQ_LISTENER_PREFETCH:10}
        retry:
          # Reintentos acotados: agotados los intentos, el mensaje va a la DLQ. La otra mitad de
          # esa garantia -no reencolar lo rechazado- la fija el codigo y no este bloque, porque un
          # reencolado infinito atasca el canal entero. Ver RabbitMqConfiguration.
          enabled: true
          max-retries: ${SPRING_RABBITMQ_LISTENER_MAX_RETRIES:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

management:
  endpoints:
    web:
      exposure:
        # outbox: el estado del outbox (GET) y el redrive de los mensajes FAILED (POST), restringidos
        # en SecurityConfiguration a ops-metrics y ops-write.
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus,outbox}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when_authorized}
    info:
      access: unrestricted
    metrics:
      access: unrestricted
    prometheus:
      access: unrestricted
  health:
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
    # Fuera del health por el mismo motivo que RabbitMQ: la cache es una optimizacion, y un Redis
    # caido no deja al servicio incapaz de atender peticiones -solo mas lento-. Contarlo como DOWN
    # sacaria la instancia del balanceador por algo de lo que se recupera sola.
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  info:
    env:
      enabled: true

  # Trazabilidad distribuida. Este servicio es el ultimo eslabon: la traza nace en mto-gateway,
  # pasa por mto-configuration -y por la cola, ver spring.rabbitmq.listener.simple arriba- y termina
  # aqui. Mismos valores que los otros dos servicios, a proposito.
  tracing:
    enabled: ${MTO_TRACING_ENABLED:true}
    sampling:
      # Muestrear el 100% en un servicio con trafico real es caro y casi nunca hace falta. Ojo: un
      # span NO muestreado sigue propagando su traceparent (con el flag a 00), asi que la cadena
      # entre servicios no se rompe por muestrear poco.
      probability: ${MTO_TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        # Las metricas salen por Prometheus (ver /actuator/prometheus). El starter de OpenTelemetry
        # arrastra tambien un registro OTLP de metricas, y sin esto intentaria empujarlas a un
        # colector ademas de exponerlas.
        enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Make-to-order inventory and stock management API
    version: ${APP_VERSION:0.0.1-SNAPSHOT}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    disable-swagger-default-url: true
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}

app:
  security:
    # Cliente de Keycloak que representa a esta API. Sus roles de cliente son los permisos que
    # comprueban la cadena de filtros y las anotaciones de seguridad de metodo.
    client-id: ${KEYCLOAK_CLIENT_ID:mto-stock-api}
    # Claim que se usa como nombre del principal, y por tanto como autor en las columnas de auditoria.
    principal-claim: preferred_username
    audience-validation-enabled: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:true}
    # Si la validacion de audiencia esta activa y este valor llega vacio, la aplicacion no arranca:
    # sin audiencia la API aceptaria cualquier token emitido por el realm, incluido el del frontal
    # de otra aplicacion.
    required-audience: ${KEYCLOAK_AUDIENCE:mto-stock-api}
    # Publicar /swagger-ui y /v3/api-docs sin autenticacion. Cerrado por defecto para que un entorno
    # desplegado nuevo no exponga el catalogo completo de endpoints por olvido: los perfiles de
    # desarrollo lo abren explicitamente.
    expose-api-docs: ${APP_SECURITY_EXPOSE_API_DOCS:false}
    # Sin CORS: lo resuelve mto-gateway, que quita Origin antes de llamar a este servicio.

  # Canal de eventos de datos maestros publicados por mto-configuration, y el exchange propio por el
  # que este servicio publica los suyos.
  #
  # El exchange y la routing key de datos maestros son contrato del emisor y no se cambian por
  # gusto: un binding contra un exchange que nadie usa se declara igual de bien y deja de llegar
  # todo sin ningun error visible. La cola y su DLQ si son de este servicio, que es quien las
  # consume. El punto de entrada de la logica de negocio es MasterDataEntityHandler.
  rabbitmq:
    # Apaga la declaracion de la topologia Y el consumidor. Con esto en false nadie abre una
    # conexion, asi que la aplicacion arranca sin broker.
    enabled: ${APP_RABBITMQ_ENABLED:true}
    master-data:
      exchange: ${APP_RABBITMQ_MASTER_DATA_EXCHANGE:mto.master-data.exchange}
      queue: ${APP_RABBITMQ_MASTER_DATA_QUEUE:mto.stock.master-data.queue}
      routing-key: "${APP_RABBITMQ_MASTER_DATA_ROUTING_KEY:mto.master-data.#}"
      dead-letter-exchange: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_EXCHANGE:mto.stock.master-data.queue.dlx}
      dead-letter-queue: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_QUEUE:mto.stock.master-data.queue.dlq}
      dead-letter-routing-key: ${APP_RABBITMQ_MASTER_DATA_DEAD_LETTER_ROUTING_KEY:mto.stock.master-data.queue.dlq}
      # Permite declarar la topologia sin consumir: util para dejar la cola creada acumulando
      # eventos mientras el servicio todavia no sabe que hacer con ellos.
      listener-enabled: ${APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED:true}
    # Exchange propio: lo que este servicio cuenta de si mismo (un material por debajo de su minimo,
    # una reserva cancelada o liberada, un ajuste de inventario), con la clave
    # mto.stock.<entidad>.<evento>. Aqui solo se declara el exchange; la cola es de quien lo consume
    # (mto-notification).
    events:
      exchange: ${APP_RABBITMQ_EVENTS_EXCHANGE:mto.stock.exchange}

  # Firma de los mensajes, sobre los bytes que viajan de verdad. Es la unica comprobacion de
  # integridad que un consumidor puede rehacer: el messageHash del payload se calcula sobre el objeto
  # antes de serializarlo y no sobrevive a la ida y vuelta.
  messaging:
    signature:
      # EL MISMO VALOR que app.messaging.signature.secret en mto-configuration y en mto-notification:
      # con el se comprueba lo que llega y se firma lo que sale. Con secreto la firma es HMAC-SHA256 y
      # protege de manipulacion; sin el se degrada a un SHA-256 simple, que detecta corrupcion pero
      # no manipulacion, porque quien altere el mensaje puede recalcularlo.
      secret: ${MESSAGING_SIGNATURE_SECRET:}
      # DISABLED no comprueba nada; OPTIONAL rechaza una firma que no cuadra pero acepta lo que no
      # puede comprobar; REQUIRED exige que todo mensaje llegue firmado y sea comprobable.
      #
      # Por defecto OPTIONAL y no REQUIRED a proposito: si los dos servicios no comparten todavia el
      # mismo secreto, el emisor firma con HMAC, aqui solo se sabe calcular SHA-256 y REQUIRED
      # mandaria a la DLQ todos los mensajes validos. Se pasa a REQUIRED cuando el secreto ya esta
      # repartido, que es como debe quedar en produccion.
      mode: ${MESSAGING_SIGNATURE_MODE:OPTIONAL}

  # Outbox de los eventos propios (docs/06-messaging.md): el evento se escribe en outbox_message
  # dentro de la transaccion de negocio y un relay lo publica despues, esperando la confirmacion del
  # broker. Todo el bloque, con el relay, las metricas, la purga y /actuator/outbox, existe solo con
  # app.rabbitmq.enabled=true; con el broker apagado el publicador de eventos no escribe nada.
  outbox:
    # Con false el outbox sigue escribiendo y solo se para el relay: los eventos esperan en la tabla.
    enabled: ${APP_OUTBOX_ENABLED:true}
    # Intentos antes de dar el mensaje por perdido (FAILED). Con backoff exponencial acotado, 20
    # intentos cubren mas de una hora de broker caido; un FAILED se reencola desde /actuator/outbox.
    max-attempts: ${APP_OUTBOX_MAX_ATTEMPTS:20}
    # Retardo del primer reintento; se duplica en cada intento hasta max-retry-delay.
    initial-retry-delay: ${APP_OUTBOX_INITIAL_RETRY_DELAY:5s}
    max-retry-delay: ${APP_OUTBOX_MAX_RETRY_DELAY:5m}
    # Desviacion aleatoria del retardo (0.2 => [0.8*d, 1.2*d]): evita que todas las replicas
    # reintenten a la vez contra un broker que acaba de levantarse.
    retry-jitter: 0.2
    # Sondeo de la tabla; es la red de seguridad, porque normalmente se publica al confirmar
    # (immediate-dispatch).
    publisher-fixed-delay: ${APP_OUTBOX_PUBLISHER_FIXED_DELAY:5s}
    # Mensajes que reclama cada pasada del relay.
    batch-size: 50
    # Tiempo que un mensaje reclamado queda invisible para el resto de replicas: la red de seguridad
    # si el proceso muere entre reclamar y publicar.
    claim-visibility-timeout: 5m
    # Espera maxima por el publisher confirm antes de dar el envio por fallido.
    confirm-timeout: 10s
    # Cada cuanto se refresca la foto del outbox que publican las metricas (los gauges no consultan
    # la base de datos en cada scrape).
    metrics-refresh-delay: 30s
    # Publica los mensajes de un mismo agregado en el orden en que se generaron. El coste es que un
    # mensaje atascado frena a los de SU agregado, solo a esos.
    strict-ordering-per-aggregate: true
    # Publica en cuanto la transaccion de negocio confirma, sin esperar al sondeo.
    immediate-dispatch: ${APP_OUTBOX_IMMEDIATE_DISPATCH:true}
    # Borrado de los mensajes ya publicados. Sin esto outbox_message solo crece: cada evento deja
    # una fila con su JSON.
    purge:
      enabled: ${APP_OUTBOX_PURGE_ENABLED:true}
      # Margen para investigar un incidente de mensajeria con la tabla delante.
      retention: ${APP_OUTBOX_PURGE_RETENTION:7d}
      # Se borra por lotes: un DELETE de millones de filas hincha el WAL y bloquea el vacuum.
      batch-size: 500
      # Tope de trabajo por pasada, para que la primera ejecucion sobre una tabla enorme no se
      # convierta en un borrado de horas.
      max-batches-per-run: 20
      fixed-delay: 1h

  # Cache de datos maestros en Redis: material, almacen, proveedor, conjunto y proyecto, por id.
  #
  # El stock NO se cachea a proposito. Cambia con cada movimiento y cada reserva, y ya tiene su
  # propia optimizacion de lectura en inventory_balance; cachearlo encima solo anadiria una copia
  # mas que mantener en hora.
  cache:
    # Apaga la cache: el CacheManager pasa a ser un NoOp, las anotaciones no guardan nada y nadie
    # abre una conexion, asi que la aplicacion arranca sin Redis. Apagado por defecto
    # -al reves que app.rabbitmq.enabled-
    # porque la cache es una optimizacion, y el modo seguro de una optimizacion es no depender de
    # una pieza mas de infraestructura mientras nadie la haya pedido.
    enabled: ${APP_CACHE_ENABLED:false}
    default-ttl: ${APP_CACHE_DEFAULT_TTL:30m}
    # Prefijo de las claves. La primera parte separa este servicio de mto-configuration, que en un
    # entorno local puede compartir el mismo Redis: sin ella, una cache llamada 'projects' en los
    # dos seria la misma clave.
    #
    # La 'v1' es la version del FORMATO y se sube al cambiar la forma de un DTO de respuesta
    # cacheado. Anadir un campo a un record es el caso peligroso: la entrada vieja no lo trae, se
    # construye con null y se sirve asi, sin error, hasta que expire el TTL. Subir la version deja
    # huerfanas las entradas viejas -caducan solas- en vez de tener que vaciar Redis a mano.
    key-prefix: ${APP_CACHE_KEY_PREFIX:mto-stock:v1:}

  # Claves de idempotencia: la cabecera Idempotency-Key de POST /reservations y POST /movements/outputs.
  idempotency:
    # Cuanto se recuerda una clave desde que se uso por primera vez. Pasado el plazo, un reintento con
    # ella es una peticion nueva, asi que tiene que sobrar frente a lo que tarda un cliente en
    # reintentar: mto-maintenance reintenta solo lo que se quedo sin respuesta cada pocos minutos
    # mientras stock le responde.
    retention: ${APP_IDEMPOTENCY_RETENTION:30d}
    purge:
      # Con esto en false las claves no caducan y idempotent_request crece con cada escritura con clave.
      enabled: ${APP_IDEMPOTENCY_PURGE_ENABLED:true}
      # Una vez al dia, de madrugada; en el minuto 17 para no coincidir con lo que se programa en punto.
      cron: "${APP_IDEMPOTENCY_PURGE_CRON:0 17 3 * * *}"

