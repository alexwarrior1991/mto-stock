services:
  postgres:
    image: postgres:16-alpine
    container_name: mto-stock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mto-stock-network

  # Broker del stack local. Es la MISMA version de imagen que usa mto-configuration a proposito:
  # el canal se prueba de punta a punta entre los dos servicios, y una diferencia de version del
  # broker es una variable mas que explicar cuando algo no llega.
  #
  # Si ya tienes en marcha el RabbitMQ de mto-configuration, comenta este servicio y apunta
  # SPRING_RABBITMQ_HOST a ese broker: son el mismo exchange y las mismas colas.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: mto-stock-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER must be set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Un socket abierto en el 5672 no significa que el broker acepte ya declaraciones: se sondea
    # con rabbitmq-diagnostics, que es lo que responde cuando el nodo esta de verdad listo.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - mto-stock-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: mto-stock-keycloak
    restart: unless-stopped
    # Keycloak 26 usa hostname v2: el puerto va dentro de la URL de --hostname, no en un
    # --hostname-port aparte. Con la URL completa, el modo estricto (el de por defecto) es justo
    # lo que se quiere: fija el 'iss' de los tokens a http://auth.mto.local:8082 sea cual sea la
    # cabecera Host de la peticion. Un emisor que variase segun quien llama no coincidiria con
    # KEYCLOAK_ISSUER_URI y la validacion fallaria.
    #
    # --import-realm carga /opt/keycloak/data/import al arrancar, de modo que el realm queda listo
    # sin tocar la consola. Si el realm ya existe, no lo pisa.
    command: start-dev --hostname=http://auth.mto.local:8082 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
      # Habilita /health/ready en el puerto de management (9000), que es lo unico que dice de
      # verdad si Keycloak ya sirve el realm.
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/mto-realm-local.json:/opt/keycloak/data/import/mto-realm-local.json:ro
    ports:
      - "${KEYCLOAK_PORT:-8082}:8080"
      - "${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    # Un socket abierto en el 8080 no significa que el realm este disponible: Keycloak acepta
    # conexiones bastante antes de servir el JWK Set, y la app arrancaria contra un Keycloak que
    # todavia no responde. Se sondea /health/ready en el puerto de management.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      # Keycloak tarda en la primera arrancada (migracion de esquema); sin esto los primeros
      # sondeos cuentan como fallo.
      start_period: 30s
    networks:
      - mto-stock-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mto-stock:${APP_IMAGE_TAG:-latest}
    container_name: mto-stock-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME must be set}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      SPRING_FLYWAY_ENABLED: ${SPRING_FLYWAY_ENABLED:-true}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:?SPRING_RABBITMQ_USERNAME must be set}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:?SPRING_RABBITMQ_PASSWORD must be set}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SPRING_RABBITMQ_VIRTUAL_HOST:-/}
      APP_RABBITMQ_ENABLED: ${APP_RABBITMQ_ENABLED:-true}
      APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED: ${APP_RABBITMQ_MASTER_DATA_LISTENER_ENABLED:-true}
      MESSAGING_SIGNATURE_SECRET: ${MESSAGING_SIGNATURE_SECRET:-}
      MESSAGING_SIGNATURE_MODE: ${MESSAGING_SIGNATURE_MODE:-OPTIONAL}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI must be set}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:?KEYCLOAK_CLIENT_ID must be set}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:?KEYCLOAK_AUDIENCE must be set}
      KEYCLOAK_AUDIENCE_VALIDATION_ENABLED: ${KEYCLOAK_AUDIENCE_VALIDATION_ENABLED:-true}
      APP_SECURITY_EXPOSE_API_DOCS: ${APP_SECURITY_EXPOSE_API_DOCS:-false}
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:?APP_CORS_ALLOWED_ORIGIN must be set}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-never}
      MANAGEMENT_HEALTH_RABBIT_ENABLED: ${MANAGEMENT_HEALTH_RABBIT_ENABLED:-false}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_APP: ${LOGGING_LEVEL_APP:-INFO}
      JAVA_OPTS: ${JAVA_OPTS:-}
    # El 'iss' del token es http://auth.mto.local:8082 y la app tiene que poder resolver ese mismo
    # nombre para descargar el JWK Set: es el mismo string el que viaja en el token y el que se
    # valida, asi que no vale apuntar a 'keycloak:8080' desde dentro de la red.
    extra_hosts:
      - "auth.mto.local:host-gateway"
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${SERVER_PORT:-8080}/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - mto-stock-network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  mto-stock-network:
    driver: bridge